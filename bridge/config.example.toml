[serial]
# Windows: "COM3"   macOS: "/dev/tty.usbmodem..."   Linux: "/dev/ttyUSB0"
port = "COM3"
baud = 115200

[gauges]
# Full-scale values sent to the Arduino (C command) and used for clamping
max_speed_kmh = 300
max_rpm = 9000
# How often to push updates to the board (Hz)
update_hz = 30

[forza]
# Enable Data Out in FH5 / FM: UDP, IP = this PC, port below
listen_ip = "0.0.0.0"
listen_port = 5300

[beamng]
# BeamNG: Options → Other → OutGauge, IP + port
listen_ip = "0.0.0.0"
listen_port = 4444

[assetto]
# Assetto Corsa shared memory (Windows). Physics map name is fixed by the game.
physics_map = "Local\\acpmf_physics"
